<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta Digital - Tres Sesenta</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-page: #f4f4f4;
            --white: #ffffff;
            --whatsapp: #25D366;
            --gmail: #EA4335;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-page);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
        }

        .card {
            position: relative;
            width: 95%;
            max-width: 900px;
            background: var(--white);
            border-radius: 15px;
            padding: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .main-image-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1051 / 602;
            border-radius: 10px;
            overflow: hidden;
        }

        .main-image-container .bg-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* TEXTO "DA CLICK AQUÍ" (MÁS GRANDE, BLANCO, SUBRAYADO Y CON ANIMACIÓN) */
        .qr-text-link {
            position: absolute;
            top: 22%;                
            right: 4.4%;
            width: 28.3%;
            text-align: center;
            font-family: 'Aileron', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: 800;        
            font-size: 18px;         
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-decoration: underline; /* Subrayado activado por defecto */
            color: var(--white);     
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3); 
            z-index: 10;
            display: inline-block;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* Animación fluida al pasar el cursor */
        .qr-text-link:hover {
            transform: translateY(-3px) scale(1.03); 
            opacity: 0.95;
            text-shadow: 0 5px 10px rgba(0, 0, 0, 0.5), 0 0 8px rgba(255, 255, 255, 0.6); 
        }

        /* AJUSTE FIJO DEL QR */
        .qr-overlay {
            position: absolute;
            top: 28.6%;    
            right: 4.4%;   
            width: 28.3%;  
            aspect-ratio: 1 / 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .qr-overlay a {
            width: 100%;
            height: 100%;
            display: block;
        }

        .qr-overlay img {
            width: 100%;
            height: 100%;
            object-fit: fill; 
        }

        /* BOTONES FLOTANTES EN LA VENTANA */
        .window-contact-group {
            position: fixed; 
            bottom: 30px;
            right: 30px;
            display: flex;
            gap: 15px;
            z-index: 9999;
        }

        .btn-float {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: white;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .btn-wpp { 
            background-color: var(--whatsapp); 
            font-size: 30px;
        }

        .btn-gmail { 
            background-color: var(--white); 
        }

        .btn-float:hover {
            transform: scale(1.1) translateY(-5px);
        }

        @media (max-width: 600px) {
            .window-contact-group {
                bottom: 20px;
                right: 20px;
                gap: 10px;
            }
            .btn-float {
                width: 55px;
                height: 55px;
            }
            .qr-text-link {
                font-size: 11px;    
                top: 23%;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="main-image-container">
            <img src="tar.png" class="bg-img" alt="Fondo Tarjeta">

            <a href="banco_de_servicios.html" target="_blank" class="qr-text-link">DA CLICK AQUÍ</a>

            <div class="qr-overlay">
                <a href="banco_de_servicios.html" target="_blank">
                    <img src="qr.png" alt="QR">
                </a>
            </div>
        </div>
    </div>

    <div class="window-contact-group">
        <a href="#" id="linkWpp" class="btn-float btn-wpp" title="WhatsApp">
            <i class="fab fa-whatsapp"></i>
        </a>

        <a href="#" id="linkGmail" class="btn-float btn-gmail" title="Gmail">
            <img src="https://upload.wikimedia.org/wikipedia/commons/7/7e/Gmail_icon_%282020%29.svg" width="32" alt="Gmail">
        </a>
    </div>

    <script>
        const miTelefono = "528331188000"; 
        const miCorreo = "abisailopezaguilar24@gmail.com";
        const asunto = "Contacto desde Tarjeta Digital";

        // Enlace de WhatsApp directo
        document.getElementById('linkWpp').href = `https://wa.me/${miTelefono}`;

        // Lógica de Gmail para móvil y PC
        if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
            document.getElementById('linkGmail').href = `mailto:${miCorreo}?subject=${encodeURIComponent(asunto)}`;
        } else {
            document.getElementById('linkGmail').href = `https://mail.google.com/mail/?view=cm&fs=1&to=${miCorreo}&su=${encodeURIComponent(asunto)}`;
        }
    </script>

</body>
</html>
